version: "1.0"
description: >
  OSC address schema for Sector Flow Analyzer → nw_wrld VJ Platform bridge.
  This file is the interface contract. Both sides must implement against it.
  Do not change addresses without bumping the version and updating both ends.

transport:
  protocol: UDP
  default_host: "127.0.0.1"
  default_port: 9000
  update_rate_hz: 1  # one broadcast per second during live mode

addresses:

  # --- Per-sector state ---

  /sector/{ticker}/weight:
    type: float
    range: [0.0, 1.0]
    description: >
      Normalized covariance coupling strength for this sector vs. the market-weighted
      average. 1.0 = maximum cohesion, 0.0 = fully decoupled.
    example: /sector/XLK/weight  0.82f

  /sector/{ticker}/flow_in:
    type: float
    unit: USD_millions
    range: [0.0, +inf]
    description: >
      Net inflow into this sector ETF over the configured window (default: 1 day).
      Sourced from real fund flow data when available; falls back to 0.0 if NULL.
    example: /sector/XLF/flow_in  412.5f

  /sector/{ticker}/flow_out:
    type: float
    unit: USD_millions
    range: [0.0, +inf]
    description: Net outflow from this sector ETF over the configured window.
    example: /sector/XLF/flow_out  87.3f

  /sector/{ticker}/momentum:
    type: float
    range: [-1.0, 1.0]
    description: >
      Signed 20-day price momentum normalized to [-1, 1].
      Positive = trending up, negative = trending down.
    example: /sector/XLE/momentum  -0.34f

  /sector/{ticker}/regime:
    type: string
    values: ["accumulation", "distribution", "neutral", "breakout", "breakdown"]
    description: >
      Current regime classification for this sector based on
      price/volume/flow signal combination. Used to drive particle behavior.
    example: /sector/XLK/regime  "accumulation"

  # --- Pairwise sector relationships ---

  /sector/pair/{ticker_a}/{ticker_b}/correlation:
    type: float
    range: [-1.0, 1.0]
    description: >
      Rolling Pearson correlation between the two sectors over the configured window.
      Drives edge thickness in the network visualization.
      ticker_a < ticker_b alphabetically to avoid duplicate pairs.
    example: /sector/pair/XLF/XLK/correlation  0.74f

  /sector/pair/{ticker_a}/{ticker_b}/flow_direction:
    type: float
    range: [-1.0, 1.0]
    description: >
      Signed estimate of capital rotation direction between the two sectors.
      Positive = net flow from ticker_b toward ticker_a.
      Negative = net flow from ticker_a toward ticker_b.
      Derived from relative flow differential when real flow data is available.
    example: /sector/pair/XLE/XLF/flow_direction  -0.61f

  # --- Market-level meta ---

  /meta/regime:
    type: string
    values: ["risk_on", "risk_off", "rotation", "neutral", "crisis"]
    description: >
      Aggregate market regime derived from cross-sector covariance structure.
      risk_on = growth sectors leading, risk_off = defensive sectors leading,
      rotation = high inter-sector divergence, crisis = all correlations converging to 1.
    example: /meta/regime  "rotation"

  /meta/cohesion:
    type: float
    range: [0.0, 1.0]
    description: >
      Average pairwise correlation across all 55 sector pairs.
      High cohesion (>0.8) often signals crisis/macro-driven moves.
      Low cohesion (<0.3) signals sector-specific rotation.
    example: /meta/cohesion  0.41f

  /meta/dominant_sector:
    type: string
    description: Ticker of the sector with the highest net inflow over the window.
    example: /meta/dominant_sector  "XLK"

  /meta/timestamp:
    type: string
    format: ISO8601
    description: UTC timestamp of the data snapshot driving this broadcast.
    example: /meta/timestamp  "2026-05-13T14:30:00Z"

  # --- Control messages (analyzer → VJ platform) ---

  /control/heartbeat:
    type: int
    description: Sent every 5 seconds. Value is Unix timestamp. VJ platform should alert if missed for >15s.

  /control/data_staleness_seconds:
    type: int
    description: Seconds since the last successful data fetch. Drive visual degradation if >3600.

  /control/mode:
    type: string
    values: ["live", "replay", "demo", "paused"]
    description: Current operating mode of the analyzer.
