version: "2.0"
description: >
  OSC address schema for Sector Flow Analyzer → nw_wrld VJ Platform bridge.
  This file is the interface contract. Both sides must implement against it.
  Do not change addresses without bumping the version and updating both ends.

  v2.0 changes from v1.0:
    REMOVED: /sector/{ticker}/weight, /sector/{ticker}/flow_in,
             /sector/{ticker}/flow_out, /sector/{ticker}/momentum,
             /sector/{ticker}/regime, /meta/regime
    ADDED:   /sector/{ticker}/flow_volume, /sector/{ticker}/momentum_rank,
             /sector/{ticker}/aum
    REASON:  Moved to objective-first data model. Regime labels removed from
             primary output; raw flow data is now the authoritative signal.

transport:
  protocol: UDP
  default_host: "127.0.0.1"
  default_port: 9000
  update_rate_hz: 1  # one broadcast per second during live mode

addresses:

  # --- Per-sector state ---

  /sector/{ticker}/flow_volume:
    type: float
    unit: USD
    range: [-inf, +inf]
    null_behavior: sent as 0.0 when SSGA data not yet ingested
    description: >
      Signed net capital flow into this sector ETF for the most recent trading
      day. Positive = inflow (shares_outstanding increased × NAV). Negative =
      outflow. Sourced directly from SSGA daily Excel snapshot.
    example: /sector/XLK/flow_volume  2300000000.0f

  /sector/{ticker}/momentum_rank:
    type: float
    range: [0.0, 1.0]
    null_behavior: all sectors return 0.5 if momentum data unavailable
    description: >
      Cross-sectional min-max normalized 20-day price momentum. The sector with
      the highest momentum among all 11 sectors gets 1.0; the lowest gets 0.0.
      This is a relative rank, not an absolute signal.
    example: /sector/XLE/momentum_rank  0.18f

  /sector/{ticker}/aum:
    type: float
    unit: USD
    range: [0.0, +inf]
    null_behavior: sent as 0.0 when SSGA data not yet ingested
    description: >
      Total net assets (AUM) of this sector ETF in USD. Sourced from SSGA daily
      Excel snapshot. Use this to scale node size in visual representations.
    example: /sector/XLK/aum  58000000000.0f

  # --- Pairwise sector relationships ---

  /sector/pair/{ticker_a}/{ticker_b}/correlation:
    type: float
    range: [-1.0, 1.0]
    description: >
      Rolling 30-day Pearson correlation between the two sectors.
      Drives edge thickness in the network visualization.
      ticker_a < ticker_b alphabetically; only significant pairs (|corr| >= 0.3)
      are broadcast.
    example: /sector/pair/XLF/XLK/correlation  0.74f

  /sector/pair/{ticker_a}/{ticker_b}/flow_direction:
    type: float
    range: [-1.0, 1.0]
    null_behavior: sent as 0.0 when net_inflow_usd is unavailable for either sector
    description: >
      Signed estimate of capital rotation direction between two sectors, scaled
      by their correlation strength. Formula:
        (net_inflow_a - net_inflow_b) / max_abs_inflow * |correlation|
      Positive = net flow from ticker_b toward ticker_a.
      Negative = net flow from ticker_a toward ticker_b.
    example: /sector/pair/XLE/XLF/flow_direction  -0.61f

  # --- Market-level meta ---

  /meta/cohesion:
    type: float
    range: [0.0, 1.0]
    description: >
      Mean absolute pairwise correlation across all sector pairs in the current
      snapshot. High cohesion (>0.8) = sectors moving together (macro-driven).
      Low cohesion (<0.3) = sector-specific rotation.
    example: /meta/cohesion  0.41f

  /meta/dominant_sector:
    type: string
    null_behavior: empty string if no flow data available
    description: >
      Ticker of the sector with the largest absolute net_inflow_usd in the
      current snapshot. Objective data — no regime interpretation.
    example: /meta/dominant_sector  "XLK"

  /meta/timestamp:
    type: string
    format: ISO8601
    description: UTC timestamp of the data snapshot driving this broadcast.
    example: /meta/timestamp  "2026-05-13T14:30:00Z"

  # --- Control messages (analyzer → VJ platform) ---

  /control/heartbeat:
    type: int
    description: Unix timestamp sent every interval_seconds. VJ platform should alert if missed for >15s.

  /control/data_staleness_seconds:
    type: int
    description: Seconds since the OSC bridge started. Use to detect stale sessions.

  /control/mode:
    type: string
    values: ["live", "replay", "demo", "paused"]
    description: Current operating mode of the analyzer.
